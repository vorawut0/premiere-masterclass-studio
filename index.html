    <!-- Fallback for uncompiled GitHub Pages branch deployments -->
    <script>
      (function() {
        if (window.location.hostname.includes('github.io')) {
          window.addEventListener('DOMContentLoaded', function() {
            setTimeout(function() {
              var root = document.getElementById('root');
              if (root && root.children.length === 0) {
                // If React has not mounted (uncompiled .tsx served from root branch)
                root.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0A0A12;color:#EDEDF4;font-family:system-ui,-apple-system,sans-serif;padding:24px;text-align:center;">' +

                  '</div>' +
                '</div>';
                window.location.href = "https://premiere-masterclass-studio.vercel.app";
              }
            }, 800);
          });
        }
      })();
    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.5; transform: scale(0.97); }
        50% { opacity: 0.85; transform: scale(1.03); }
      }
      @keyframes loadProgress {
        0% { width: 10%; margin-left: 0%; }
        50% { width: 70%; margin-left: 20%; }
        100% { width: 100%; margin-left: 0%; }
      }
    </style>
  </head>

    <div id="root">
      <div id="initial-preloader" style="position:fixed;inset:0;background:#07090E;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:99999;font-family:'Prompt',-apple-system,BlinkMacSystemFont,sans-serif;color:#FFFFFF;text-align:center;padding:24px;">
        <div style="position:absolute;width:480px;height:480px;background:radial-gradient(circle, rgba(99,102,241,0.2) 0%, rgba(139,92,246,0.1) 45%, transparent 70%);border-radius:50%;filter:blur(80px);pointer-events:none;"></div>

        </div>

        <div style="font-size:24px;font-weight:800;letter-spacing:-0.02em;margin-bottom:6px;color:#FFFFFF;">
          Premiere <span style="background:linear-gradient(135deg, #A78BFA, #9999FF, #38BDF8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">Masterclass</span>
        </div>
        <div style="font-size:13px;color:#94A3B8;margin-bottom:28px;">หลักสูตรตัดต่อวิดีโอระดับมืออาชีพ</div>

        <div style="width:260px;height:6px;background:#141824;border-radius:999px;overflow:hidden;border:1px solid rgba(129,140,248,0.25);position:relative;">
          <div style="height:100%;background:linear-gradient(90deg, #6366F1, #9999FF, #38BDF8);border-radius:999px;animation:loadProgress 1.5s ease-in-out infinite;"></div>
        </div>
        <div style="font-size:11px;font-family:monospace;color:#64748B;margin-top:14px;letter-spacing:0.05em;">INITIALIZING MASTER WORKSPACE...</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
